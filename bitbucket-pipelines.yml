---
image: cwimmer/build:stable
options:
  max-time: 5
clone:
  depth: full

pipelines:
  custom:
    update-dependencies:
      - step:
          name: Update to latest version of dependencies
          caches:
            - docker
          services:
            - docker
          script:
            - make update-versions
            - make update-submodule
            - for i in $(ls *_VERSION); do echo -n "$i:" ; cat $i; done
            - make commit-updates
  branches:
    main:
      - step:
          name: Build Alpine image
          deployment: Digital_Ocean_Registry
          services:
            - docker
          script:
            - make update-submodule
            - make build
            - make upload
            - make commit-updates-pipeline
      - parallel:
          - step:
              name: Rebuild image-golang with this image
              caches:
                - docker
              services:
                - docker
              script:
                - pipe: atlassian/trigger-pipeline:5.0.1
                  variables:
                    BITBUCKET_USERNAME: 'cwimmer'
                    BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD
                    REPOSITORY: 'image-golang'
                    # ACCOUNT: '<string>' # Optional
                    REF_NAME: 'main'
                    REF_TYPE: 'branch'
                    CUSTOM_PIPELINE_NAME: 'update-dependencies'
                    # PIPELINE_VARIABLES: '<json>' # Optional
                    WAIT: 'false'  # Optional
                    # WAIT_MAX_TIMEOUT: '<string>' # Optional
                    # DEBUG: '<boolean>' # Optional
          - step:
              name: Rebuild image-hugo with this image
              caches:
                - docker
              services:
                - docker
              script:
                - pipe: atlassian/trigger-pipeline:5.0.1
                  variables:
                    BITBUCKET_USERNAME: 'cwimmer'
                    BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD
                    REPOSITORY: 'image-hugo'
                    # ACCOUNT: '<string>' # Optional
                    REF_NAME: 'develop'
                    REF_TYPE: 'branch'
                    CUSTOM_PIPELINE_NAME: 'update-dependencies'
                    # PIPELINE_VARIABLES: '<json>' # Optional
                    WAIT: 'false'  # Optional
                    # WAIT_MAX_TIMEOUT: '<string>' # Optional
                    # DEBUG: '<boolean>' # Optional
          - step:
              name: Rebuild image-imagemagick with this image
              caches:
                - docker
              services:
                - docker
              script:
                - pipe: atlassian/trigger-pipeline:5.0.1
                  variables:
                    BITBUCKET_USERNAME: 'cwimmer'
                    BITBUCKET_APP_PASSWORD: $BITBUCKET_APP_PASSWORD
                    REPOSITORY: 'image-imagemagick'
                    # ACCOUNT: '<string>' # Optional
                    REF_NAME: 'develop'
                    REF_TYPE: 'branch'
                    CUSTOM_PIPELINE_NAME: 'update-dependencies'
                    # PIPELINE_VARIABLES: '<json>' # Optional
                    WAIT: 'false'  # Optional
                    # WAIT_MAX_TIMEOUT: '<string>' # Optional
                    # DEBUG: '<boolean>' # Optional
